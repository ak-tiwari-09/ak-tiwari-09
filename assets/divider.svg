<svg width="1000" height="6" viewBox="0 0 1000 6" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Divider">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="0.5" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="4s" repeatCount="indefinite"/>
