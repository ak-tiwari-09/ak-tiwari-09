<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Adarsh Tiwari - Software Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#14264d"/>
      <stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1000" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <!-- floating dots -->
    <g fill="#79c0ff">
      <circle cx="120" cy="200" r="3" opacity="0.5"><animate attributeName="cy" values="200;40;200" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="230" r="2" opacity="0.4"><animate attributeName="cy" values="230;60;230" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="210" r="3" opacity="0.5"><animate attributeName="cy" values="210;30;210" dur="11s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="235" r="2" opacity="0.4"><animate attributeName="cy" values="235;50;235" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="205" r="3" opacity="0.5"><animate attributeName="cy" values="205;45;205" dur="10s" repeatCount="indefinite"/></circle>
    </g>
    <!-- waves -->
    <path d="M0 205 Q125 170 250 205 T500 205 T750 205 T1000 205 T1250 205 T1500 205 T1750 205 T2000 205 V260 H0 Z" fill="#2f81f7" opacity="0.25">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M0 220 Q125 190 250 220 T500 220 T750 220 T1000 220 T1250 220 T1500 220 T1750 220 T2000 220 V260 H0 Z" fill="#79c0ff" opacity="0.2">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M0 235 Q125 212 250 235 T500 235 T750 235 T1000 235 T1250 235 T1500 235 T1750 235 T2000 235 V260 H0 Z" fill="#0d1117" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <!-- text -->
    <g text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="500" y="105" font-size="54" font-weight="700" fill="url(#name)" opacity="0">
        ADARSH TIWARI
        <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" dur="1.4s" fill="freeze"/>
      </text>
      <text x="500" y="152" font-size="22" fill="#c9d1d9" letter-spacing="4" opacity="0">
        SOFTWARE DEVELOPER
        <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="1.4s" fill="freeze"/>
      </text>
      <text x="500" y="184" font-size="15" fill="#8b949e" letter-spacing="2" opacity="0">
        FULL-STACK  •  REST APIs  •  BACKEND
        <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="1.4s" fill="freeze"/>
      </text>
    </g>
  </g>
</svg>
